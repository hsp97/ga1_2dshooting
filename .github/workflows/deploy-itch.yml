name: Deploy to itch.io

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: itch-deploy
  cancel-in-progress: true

env:
  ITCH_USER: hyunpark
  ITCH_GAME: ga1-shooting
  BUILD_NAME: ga1-shooting

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto          # ProjectVersion.txt에서 읽음
          targetPlatform: WebGL
          buildName: ${{ env.BUILD_NAME }}

      - name: Fix permissions
        run: sudo chown -R $USER:$USER build

      - name: Verify build output
        run: ls -R build

      - name: Setup butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push "build/WebGL/$BUILD_NAME" "$ITCH_USER/$ITCH_GAME:html" \
            --userversion "0.1.${{ github.run_number }}"
          ./butler status "$ITCH_USER/$ITCH_GAME:html"