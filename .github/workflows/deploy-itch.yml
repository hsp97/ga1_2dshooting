name: Deploy to itch.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: itch-deploy
  cancel-in-progress: false

env:
  ITCH_USER: hyunpark
  ITCH_GAME: ga1-shooting
  BUILD_NAME: ga1-shooting

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "LICENSE  length: ${#UNITY_LICENSE}"
          echo "EMAIL    length: ${#UNITY_EMAIL}"
          echo "PASSWORD length: ${#UNITY_PASSWORD}"

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: ${{ env.BUILD_NAME }}
          versioning: Custom
          version: ${{ steps.ver.outputs.value }}

      - name: Fix permissions
        run: sudo chown -R $USER:$USER build

      - name: Verify build output
        run: ls -R build

      - name: Setup butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push "build/WebGL/$BUILD_NAME" "$ITCH_USER/$ITCH_GAME:html" \
            --userversion "${{ steps.ver.outputs.value }}"
          ./butler status "$ITCH_USER/$ITCH_GAME:html"